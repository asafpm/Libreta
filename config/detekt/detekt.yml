# Applied on top of detekt's default config (buildUponDefaultConfig = true).
# Keep this minimal: only list rules whose defaults don't fit the project.

naming:
  FunctionNaming:
    ignoreAnnotated:
      - 'Composable'

style:
  MagicNumber:
    # Enum entries name their values already (paper sizes, …).
    ignoreEnums: true

complexity:
  TooManyFunctions:
    # Framework callbacks (View.onDraw, onTouchEvent, …) are not a design choice.
    ignoreOverridden: true
