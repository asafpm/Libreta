name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - uses: android-actions/setup-android@v4

      # Also validates the Gradle wrapper checksum.
      - uses: gradle/actions/setup-gradle@v6

      - name: Build and test
        shell: bash
        run: scripts/ci.sh --no-daemon --stacktrace 2>&1 | tee ci.log

      - name: Report failures
        if: failure()
        run: python3 scripts/ci-annotate.py ci.log

      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            ci.log
            **/build/reports/
            **/build/screenshot-diffs/
